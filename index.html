<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5b301" />
    <link rel="manifest" href="/manifest.json" />
    <title>Maze Miner Race v5</title>
  </head>
  <body>
    <main id="app">
      <header>
        <h1>⛏️ Maze Miner Race <span>v5</span></h1>
        <label
          >Language
          <select id="lang">
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="it">Italiano</option>
            <option value="pt">Português</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="zh">简体中文</option>
            <option value="hi">हिन्दी</option>
            <option value="ar">العربية</option>
          </select></label
        >
      </header>
      <section class="hud">
        <button id="start">▶ Play</button>
        <button id="pause">⏸ Pause</button>
        <span id="state">READY</span>
        <span>Time: <b id="timer">120</b></span>
        <span>Score: <b id="score">0</b></span>
      </section>
      <p id="feed" aria-live="polite">Use WASD or arrow keys. Mine adjacent blocks with Space.</p>
      <div id="board" role="grid" aria-label="Maze board"></div>
      <nav aria-label="D-pad">
        <button data-move="0,-1">⬆️</button>
        <button data-move="-1,0">⬅️</button>
        <button data-mine>⛏️ Mine</button>
        <button data-move="1,0">➡️</button>
        <button data-move="0,1">⬇️</button>
      </nav>
      <section>
        <h2>Daily challenge</h2>
        <p id="challenge">Seeded maze with server-ready receipt validation.</p>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
